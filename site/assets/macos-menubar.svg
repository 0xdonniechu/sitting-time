  <circle cx="535" cy="457" r="5" fill="#58ad66"/><text x="549" y="462" fill="#555f66" font-family="Arial,sans-serif" font-size="12">Standing</text><text x="820" y="462" text-anchor="end" fill="#303840" font-family="monospace" font-size="12">36m</text>
  <circle cx="535" cy="485" r="5" fill="#999fa5"/><text x="549" y="490" fill="#555f66" font-family="Arial,sans-serif" font-size="12">Rest</text><text x="820" y="490" text-anchor="end" fill="#303840" font-family="monospace" font-size="12">42m</text>
