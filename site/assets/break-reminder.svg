<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">SittingTime break reminder preview</title>
  <desc id="desc">An illustrative optional full-screen break reminder with a bilingual health fact and a dismiss hint.</desc>
  <defs><radialGradient id="wash" cx="50%" cy="42%" r="70%"><stop stop-color="#fff"/><stop offset=".7" stop-color="#f4faf6"/><stop offset="1" stop-color="#e7f1ee"/></radialGradient><filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#467564" flood-opacity=".09"/></filter></defs>
  <rect width="1280" height="720" rx="24" fill="#dce4e6"/><rect x="35" y="35" width="1210" height="650" rx="15" fill="url(#wash)"/>
  <rect x="82" y="78" width="1116" height="564" rx="12" fill="none" stroke="#d9e7df"/>
  <circle cx="640" cy="170" r="24" fill="#dff3da"/><path d="M640 155v30m-15-15h30" stroke="#26844b" stroke-width="3" stroke-linecap="round"/>
  <text x="640" y="231" text-anchor="middle" fill="#208120" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3">SITTINGTIME · BREAK TIME</text>
  <text x="640" y="316" text-anchor="middle" fill="#208120" font-family="Arial,sans-serif" font-size="60" font-weight="700" letter-spacing="-2">It’s time to stand up.</text>
  <text x="640" y="362" text-anchor="middle" fill="#555f5d" font-family="Arial,sans-serif" font-size="24">Stand up and move for five minutes.</text>
  <rect x="300" y="418" width="680" height="132" rx="17" fill="#eaf5e8" filter="url(#shadow)"/>
  <text x="640" y="458" text-anchor="middle" fill="#33884b" font-family="Arial,sans-serif" font-size="31">🧘</text>
  <text x="640" y="491" text-anchor="middle" fill="#28342e" font-family="Arial,sans-serif" font-size="16" font-weight="600">Giữ mỗi động tác giãn cơ 10–30 giây, lặp lại 2–4 lần,</text>
  <text x="640" y="514" text-anchor="middle" fill="#28342e" font-family="Arial,sans-serif" font-size="16" font-weight="600">không nhún và không cố đến mức đau.</text>
  <text x="640" y="539" text-anchor="middle" fill="#68736c" font-family="Arial,sans-serif" font-size="14">Hold each stretch for 10–30 seconds and repeat it 2–4 times,</text>
  <text x="640" y="560" text-anchor="middle" fill="#68736c" font-family="Arial,sans-serif" font-size="14">without bouncing or pushing into pain.</text>
  <text x="640" y="609" text-anchor="middle" fill="#87938c" font-family="Arial,sans-serif" font-size="13">Click or press any key to dismiss · optional full-screen reminder</text>
</svg>
