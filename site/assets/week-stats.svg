<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">SittingTime weekly statistics preview</title>
  <desc id="desc">An illustrative week view with sitting, standing, and rest totals, a stacked daily chart, and a daily breakdown.</desc>
  <defs><filter id="shadow" x="-12%" y="-15%" width="124%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1a2f3b" flood-opacity=".12"/></filter></defs>
  <rect width="1120" height="720" rx="25" fill="#edf2f4"/>
  <rect x="75" y="45" width="970" height="630" rx="22" fill="#fff" stroke="#dce1e4" filter="url(#shadow)"/>
  <text x="115" y="103" fill="#6e7780" font-family="Arial,sans-serif" font-size="13">‹ Back to timer</text>
  <rect x="820" y="75" width="180" height="42" rx="10" fill="#f0f2f4"/><rect x="911" y="79" width="85" height="34" rx="8" fill="#fff" stroke="#d6dce0"/><text x="865" y="101" text-anchor="middle" fill="#727b82" font-family="Arial,sans-serif" font-size="13">Day</text><text x="953" y="101" text-anchor="middle" fill="#145595" font-family="Arial,sans-serif" font-size="13" font-weight="700">Week</text>
