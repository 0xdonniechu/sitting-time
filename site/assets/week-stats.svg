  <text x="115" y="216" fill="#1d2930" font-family="Arial,sans-serif" font-size="43" font-weight="600">18h 42m</text><text x="116" y="243" fill="#6d777e" font-family="Arial,sans-serif" font-size="14">Weekly total · 2h 40m daily average</text>
  <rect x="118" y="274" width="860" height="202" rx="12" fill="#fbfcfc" stroke="#edf0f1"/>
  <path d="M158 426H948M158 378H948M158 330H948" stroke="#e8ecee" stroke-dasharray="4 5"/>
  <g fill="#f08b49"><rect x="205" y="350" width="46" height="76" rx="4"/><rect x="311" y="328" width="46" height="98" rx="4"/><rect x="417" y="365" width="46" height="61" rx="4"/><rect x="523" y="319" width="46" height="107" rx="4"/><rect x="629" y="343" width="46" height="83" rx="4"/><rect x="735" y="333" width="46" height="93" rx="4"/><rect x="841" y="370" width="46" height="56" rx="4"/></g>
  <g fill="#67bd70"><rect x="205" y="333" width="46" height="17" rx="4"/><rect x="311" y="300" width="46" height="28" rx="4"/><rect x="417" y="348" width="46" height="17" rx="4"/><rect x="523" y="285" width="46" height="34" rx="4"/><rect x="629" y="319" width="46" height="24" rx="4"/><rect x="735" y="304" width="46" height="29" rx="4"/><rect x="841" y="355" width="46" height="15" rx="4"/></g>
  <g fill="#a9afb5"><rect x="205" y="322" width="46" height="11" rx="4"/><rect x="311" y="282" width="46" height="18" rx="4"/><rect x="417" y="334" width="46" height="14" rx="4"/><rect x="523" y="266" width="46" height="19" rx="4"/><rect x="629" y="303" width="46" height="16" rx="4"/><rect x="735" y="284" width="46" height="20" rx="4"/><rect x="841" y="338" width="46" height="17" rx="4"/></g>
  <g fill="#6f7980" font-family="Arial,sans-serif" font-size="12" text-anchor="middle"><text x="228" y="452">Mon</text><text x="334" y="452">Tue</text><text x="440" y="452">Wed</text><text x="546" y="452">Thu</text><text x="652" y="452">Fri</text><text x="758" y="452">Sat</text><text x="864" y="452">Sun</text></g>
