<svg xmlns="http://www.w3.org/2000/svg" viewBox="96 32 708 1050" role="img" aria-labelledby="title desc">
  <title id="title">SittingTime Windows timer preview</title>
  <desc id="desc">A close-up preview of the Windows timer window, showing Pomodoro, a countdown, session controls, and today's sitting and standing totals.</desc>
  <defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#eef5f8"/><stop offset="1" stop-color="#e7eef2"/></linearGradient><linearGradient id="clock" x2="1"><stop stop-color="#104e92"/><stop offset="1" stop-color="#057fd7"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#203a49" flood-opacity=".15"/></filter></defs>
  <rect width="900" height="1120" rx="34" fill="url(#bg)"/>
  <rect x="120" y="50" width="660" height="1020" rx="28" fill="#f8f8fa" stroke="#d8dce2" filter="url(#shadow)"/>
  <path d="M148 50h604a28 28 0 0 1 28 28v40H120V78a28 28 0 0 1 28-28" fill="#fff"/>
  <rect x="145" y="76" width="20" height="20" rx="5" fill="#172824"/><text x="155" y="90" text-anchor="middle" fill="#c8f277" font-family="Arial,sans-serif" font-size="9" font-weight="700">ST</text>
  <text x="177" y="91" fill="#505963" font-family="Arial,sans-serif" font-size="15">SittingTime</text>
  <path d="M689 86h16" stroke="#68717b" stroke-width="1.5"/><rect x="720" y="79" width="13" height="13" fill="none" stroke="#68717b" stroke-width="1.4"/><path d="m754 79 12 12m0-12-12 12" stroke="#68717b" stroke-width="1.5"/>
  <text x="170" y="160" fill="#104e92" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2.5">SITTINGTIME</text>
  <text x="170" y="196" fill="#232a30" font-family="Arial,sans-serif" font-size="28" font-weight="700">Pomodoro</text>
  <rect x="680" y="142" width="54" height="55" rx="9" fill="#fff" stroke="#eadbdb"/><rect x="680" y="142" width="54" height="8" rx="4" fill="#d84a4a"/>
  <text x="707" y="176" text-anchor="middle" fill="#d84a4a" font-family="Arial,sans-serif" font-size="20" font-weight="700">26</text><text x="707" y="190" text-anchor="middle" fill="#777" font-family="Arial,sans-serif" font-size="8">LUNAR · HORSE</text>
  <text x="450" y="382" text-anchor="middle" fill="url(#clock)" font-family="Arial,sans-serif" font-size="112" font-weight="600" letter-spacing="-7">18:24</text>
  <rect x="235" y="413" width="430" height="9" rx="5" fill="#e1e7ed"/><rect x="235" y="413" width="117" height="9" rx="5" fill="#1683c8"/>
  <rect x="367" y="448" width="166" height="38" rx="19" fill="#e6f2fa"/><text x="450" y="473" text-anchor="middle" fill="#104e92" font-family="Arial,sans-serif" font-size="16" font-weight="700">Focus</text>
  <text x="450" y="510" text-anchor="middle" fill="#747b83" font-family="Arial,sans-serif" font-size="14">Running · Session 2 of 4</text>
  <rect x="178" y="557" width="270" height="58" rx="12" fill="#104e92"/><text x="313" y="593" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="17" font-weight="700">Pause</text>
  <rect x="460" y="557" width="262" height="58" rx="12" fill="#f8f8fa" stroke="#d8dce2"/><text x="591" y="593" text-anchor="middle" fill="#343b42" font-family="Arial,sans-serif" font-size="17" font-weight="700">Skip</text>
  <rect x="178" y="635" width="544" height="52" rx="12" fill="#edf0f4"/><rect x="182" y="639" width="266" height="44" rx="9" fill="#fff"/><text x="315" y="667" text-anchor="middle" fill="#104e92" font-family="Arial,sans-serif" font-size="15" font-weight="700">Pomodoro</text><text x="585" y="667" text-anchor="middle" fill="#6e7680" font-family="Arial,sans-serif" font-size="15">Stand Up</text>
  <rect x="153" y="728" width="594" height="231" rx="15" fill="#fff" stroke="#e7e8ec"/>
  <text x="183" y="773" fill="#242b30" font-family="Arial,sans-serif" font-size="18" font-weight="700">Today</text>
  <circle cx="193" cy="817" r="6" fill="#f08b49"/><text x="212" y="823" fill="#49515a" font-family="Arial,sans-serif" font-size="15">Sitting</text><text x="711" y="823" text-anchor="end" fill="#303840" font-family="Arial,sans-serif" font-size="15" font-weight="700">1h 12m</text>
  <circle cx="193" cy="858" r="6" fill="#55b76f"/><text x="212" y="864" fill="#49515a" font-family="Arial,sans-serif" font-size="15">Standing</text><text x="711" y="864" text-anchor="end" fill="#303840" font-family="Arial,sans-serif" font-size="15" font-weight="700">15m</text>
  <circle cx="193" cy="899" r="6" fill="#9aa3ad"/><text x="212" y="905" fill="#49515a" font-family="Arial,sans-serif" font-size="15">Rest</text><text x="711" y="905" text-anchor="end" fill="#303840" font-family="Arial,sans-serif" font-size="15" font-weight="700">20m</text>
</svg>
