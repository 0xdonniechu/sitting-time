<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SittingTime Reminder</title>
  </head>
  <body>
    <main id="reminder" role="alert" aria-live="assertive">
      <p class="brand">SITTINGTIME</p>
      <h1 id="reminder-title">It’s time to stand up</h1>
      <p id="reminder-body">Move around for a few minutes</p>
      <figure id="reminder-fact" hidden>
        <div id="fact-emoji" aria-hidden="true"></div>
        <p id="fact-vi" lang="vi"></p>
        <p id="fact-en"></p>
      </figure>
      <span>Click anywhere or press Esc to dismiss</span>
    </main>
    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
